<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover：让页面铺满刘海屏；底部安全区在 CSS 里用 env() 处理 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RESTRICTED</title>
<style>
/* ===================== 1. 颜色与基础样式 ===================== */
:root {
  --bg:#070b14; --panel:rgba(15,23,43,.62); --ink:#dfe8f7; --muted:#7f8fae; --line:rgba(140,170,230,.22);
  --accent:#7aa7ff; --accent-ink:#06101f; --danger:#ff7a8a; --code-bg:rgba(8,13,28,.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.6;
}
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ===================== 2. 登录界面：代码编辑器开场 ===================== */
#login { position: relative; height: 100%; display: flex; align-items: center; justify-content: center;
  padding: 24px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #efece5 0%, #e3dfd6 75%); }
/* 启动画面：HUD 文字 + 十字标记 + 线条徽标描边 + 标题逐字出现 + 进度条 */
#splash { position: absolute; inset: 0; z-index: 5; color: #e8eaec;
  background: radial-gradient(ellipse at 50% 35%, #101214 0%, #050607 70%); transition: opacity .7s ease, visibility .7s; }
#splash.out { opacity: 0; visibility: hidden; pointer-events: none; }
#splash .hud { position: absolute; left: 18px; top: calc(18px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column;
  gap: 3px; font-size: 9px; letter-spacing: .14em; color: #6b7178; opacity: 0; transition: opacity .8s; }
#splash .hud b { color: #e8eaec; font-size: 13px; letter-spacing: .2em; }
#splash .hud i { font-style: normal; }
#skipBtn { position: absolute; right: 18px; top: calc(16px + env(safe-area-inset-top, 0px)); background: transparent; border: 1px solid #2a2e33;
  color: #7b8289; font: inherit; font-size: 11px; padding: 4px 12px; letter-spacing: .1em; opacity: 0; transition: opacity .8s; }
.xh { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 8px; color: #4c5258; letter-spacing: .2em; opacity: 0; transition: opacity .8s; }
.xh u { position: relative; display: block; width: 14px; height: 14px; }
.xh u::before, .xh u::after { content: ""; position: absolute; background: #4c5258; }
.xh u::before { left: 6.5px; top: 0; width: 1px; height: 14px; }
.xh u::after { top: 6.5px; left: 0; height: 1px; width: 14px; }
.xl { left: 14%; top: 46%; } .xr { right: 14%; top: 46%; } .xb { right: 22%; bottom: 20%; }
#splash.s1 .hud, #splash.s1 #skipBtn, #splash.s1 .xh, #splash.s1 .load { opacity: 1; }
#splash .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-bottom: 6vh; }
#emblem { width: 120px; height: 110px; overflow: visible; transition: filter 1s; }
#emblem .p { fill: none; stroke: url(#sg); stroke-width: 2.2; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1;
  transition: stroke-dashoffset 1.6s cubic-bezier(.6,0,.2,1); }
#emblem .f { fill: #c9ced3; opacity: 0; transition: opacity .8s; }
#splash.s2 #emblem .p { stroke-dashoffset: 0; }
#splash.s3 #emblem .f { opacity: .9; }
#splash.s3 #emblem { filter: drop-shadow(0 0 14px rgba(220,230,240,.45)); }
#word { display: flex; font-size: 28px; font-weight: 600; letter-spacing: .28em; margin-right: -.28em; min-height: 1.4em; }
#word span { opacity: 0; transform: translateY(8px); transition: opacity .5s, transform .5s; transition-delay: calc(var(--i) * 70ms); }
#splash.s4 #word span { opacity: 1; transform: none; }
#splash .rule { width: 0; height: 1px; background: #3a4046; transition: width 1s ease; }
#splash.s5 .rule { width: 150px; }
#splash .sub, #splash .sub2 { opacity: 0; transition: opacity .8s; }
#splash .sub { font-size: 12px; letter-spacing: .5em; margin-right: -.5em; color: #aab0b6; }
#splash .sub2 { font-size: 8px; letter-spacing: .22em; color: #5b6168; }
#splash.s5 .sub, #splash.s5 .sub2 { opacity: 1; }
#splash .load { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(34px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 9px; color: #5b6168; letter-spacing: .2em; opacity: 0; transition: opacity .8s; }
.bar { width: 160px; height: 1px; background: #22262a; }
.bar i { display: block; height: 100%; width: 0; background: #c9ced3; }
#login .scan { position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0, rgba(0,0,0,.28) 1px, transparent 1px, transparent 3px); }
/* ===== 登录页：浅色"访问身份确认"（启动画面之后切换到这里） ===== */
#login .scan { display: none; }
#rings { position: absolute; left: 50%; top: 50%; width: min(104vw, 720px); aspect-ratio: 1; z-index: 1; pointer-events: none;
  transform: translate(-50%, -50%) scale(.94); opacity: 0; transition: opacity 1.4s ease, transform 1.4s ease; }
#login.on #rings { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#rings circle { fill: none; transform-box: fill-box; transform-origin: center; }
#rings .r0 { stroke: #9a958b; stroke-width: 5; stroke-dasharray: .25 1.75; animation: spin 140s linear infinite; }
#rings .r1 { stroke: #2a2a2a; stroke-width: 1.2; stroke-dasharray: 78 22; animation: spin 100s linear infinite; }
#rings .r2 { stroke: #2a2a2a; stroke-width: 2.6; stroke-dasharray: 64 36; animation: spin 80s linear infinite reverse; }
#rings .r3 { stroke: #d9783b; stroke-width: 3.4; stroke-dasharray: 44 56; animation: spin 55s linear infinite; }
#rings .r4 { stroke: #d9783b; stroke-width: 9; opacity: .22; stroke-dasharray: 14 86; animation: spin 42s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.lhud { position: absolute; z-index: 2; left: 18px; top: calc(18px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column;
  gap: 3px; font-size: 9px; letter-spacing: .14em; color: #8a857b; opacity: 0; transition: opacity 1s .4s; }
.lhud b { color: #1b1b1b; font-size: 13px; letter-spacing: .2em; }
.lhud i { font-style: normal; }
.foot { position: absolute; z-index: 2; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); text-align: center;
  font-size: 9px; letter-spacing: .22em; color: #8a857b; opacity: 0; transition: opacity 1s .4s; }
#login.on .lhud, #login.on .foot { opacity: 1; }
#login .idf { position: relative; z-index: 2; width: min(86vw, 340px); display: flex; flex-direction: column; align-items: center; text-align: center;
  color: #1b1b1b; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  transition: opacity .8s ease, transform .8s ease, visibility .8s; }
#login .idf.off { opacity: 0; visibility: hidden; transform: translateY(10px); }
.idf .eyebrow { font: 10px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .3em; color: #6e6a63; }
.idf h1 { margin: 8px 0 6px; font-size: 28px; font-weight: 600; letter-spacing: .16em; color: #1b1b1b; }
.idf .hint { margin: 0; font-size: 11px; color: #7a756c; letter-spacing: .06em; }
.idf .oline { width: 90px; height: 1px; background: #d9783b; margin: 14px 0 18px; }
.idf .card { width: 100%; padding: 2px 14px; background: rgba(255,255,255,.38); border: 1px solid #77726a; }
.idf .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 12px;
  border-bottom: 1px solid rgba(27,27,27,.18); }
.idf .row:last-child { border-bottom: 0; }
.idf .row:focus-within { border-bottom-color: #d9783b; }
.idf .row span { color: #7a756c; white-space: nowrap; }
.idf .row b { font: 600 12px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
#login input { width: 58%; min-width: 0; background: transparent; border: 0; outline: 0; text-align: right; color: #1b1b1b;
  font: 16px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .25em; caret-color: #d9783b; }
#login .primary { width: 100%; margin-top: 14px; padding: 12px; border: 0; background: #1b1b1b; color: #efebe3;
  font: inherit; font-size: 13px; letter-spacing: .5em; text-indent: .5em; }
#login .primary:hover, #login .primary:active { background: #d9783b; color: #fff; }
#login .primary:disabled { opacity: .5; }
#loginErr { color: #c4421a; font-size: 12px; min-height: 20px; margin-top: 10px; }
@media (prefers-reduced-motion: reduce) { #rings circle { animation: none; } }

/* ===================== 3. 聊天界面整体布局 ===================== */
#app { height: 100dvh; display: flex; flex-direction: column; }
header {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
header strong { font-size: 17px; }
header .actions { display: flex; gap: 6px; }
header button {
  border: 1px solid var(--line); background: transparent; border-radius: 8px;
  padding: 4px 12px; font-size: 14px; color: var(--muted);
}

/* 消息列表：可滚动区域 */
#messages { flex: 1; overflow-y: auto; padding: 16px 12px; -webkit-overflow-scrolling: touch; }
#messages .inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.empty { margin: 18vh auto 0; text-align: center; color: var(--muted); font-size: 14px; }

/* 对话气泡：用户在右，AI 在左 */
.msg { display: flex; flex-direction: column; max-width: 88%; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.assistant { align-self: flex-start; align-items: flex-start; }
.bubble {
  padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-break: break-word;
}
.user .bubble { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.assistant .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.bubble.error { color: var(--danger); border-color: var(--danger); }
.bubble code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: .92em; }
.bubble pre {
  margin: 8px 0; padding: 10px 12px; background: var(--code-bg); color: var(--ink);
  border-radius: 8px; overflow-x: auto; white-space: pre;
}
.bubble pre code { background: none; padding: 0; }
.imgs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; justify-content: flex-end; }
.imgs img { max-width: 180px; max-height: 180px; border-radius: 10px; object-fit: cover; }

/* "正在思考"提示：三个点依次闪动 */
.thinking { color: var(--muted); }
.thinking i { font-style: normal; animation: blink 1.2s infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; }
.thinking i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .thinking i { animation: none; } }

/* ===================== 4. 输入区 ===================== */
#composer {
  flex: none; background: var(--panel); border-top: 1px solid var(--line);
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
}
#composer .wrap { max-width: 820px; margin: 0 auto; }
#previews { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0 8px; }
.thumb { position: relative; }
.thumb img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; display: block; border: 1px solid var(--line); }
.thumb button {
  position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%;
  border: 0; background: #222; color: #fff; font-size: 14px; line-height: 22px; padding: 0;
}
.row { display: flex; align-items: flex-end; gap: 8px; }
.icon-btn {
  flex: none; width: 40px; height: 40px; border-radius: 10px;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
}
.icon-btn svg { width: 22px; height: 22px; }
#input {
  flex: 1; min-height: 40px; max-height: 160px; resize: none;
  padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink);
  font: inherit; font-size: 16px; /* 16px 可避免 iOS 聚焦时自动放大页面 */ line-height: 1.5;
}
#sendBtn {
  flex: none; height: 40px; padding: 0 16px; border: 0; border-radius: 10px;
  background: var(--accent); color: var(--accent-ink); font-weight: 600;
}
#sendBtn.stop { background: var(--danger); }

/* ===================== 5. 摄像头弹窗（电脑端） ===================== */
#camModal {
  position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.75);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
#camBox { background: var(--panel); border-radius: 14px; padding: 12px; width: 100%; max-width: 640px; }
#camVideo { width: 100%; max-height: 65vh; background: #000; border-radius: 10px; display: block; }
#camBox .btns { display: flex; justify-content: center; gap: 12px; margin-top: 12px; }
#camBox .btns button { padding: 10px 22px; border-radius: 10px; border: 1px solid var(--line); background: transparent; }
#camBox .btns .shoot { background: var(--accent); color: var(--accent-ink); border: 0; font-weight: 600; }

/* ===================== 蓝色工作模式（聊天界面） ===================== */
#login { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }  /* 登录页保持等宽字体 */
#app { position: relative; background: var(--bg); isolation: isolate; }
#wall { position: absolute; inset: 0; z-index: 0;                       /* 背景层：默认是深蓝渐变，可换成自己的壁纸 */
  background: radial-gradient(ellipse 70% 50% at 78% 18%, rgba(96,130,235,.38), transparent 70%),
              radial-gradient(ellipse 60% 45% at 15% 85%, rgba(70,90,190,.30), transparent 70%),
              linear-gradient(180deg, #0a1020, #070b14 60%, #0a0f1e); }
header, #messages, #composer { position: relative; z-index: 1; }
header { background: rgba(8,13,28,.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
header .brand { display: flex; flex-direction: column; line-height: 1.15; font-size: 15px; letter-spacing: .22em; color: var(--ink); font-weight: 600; }
header button { border-radius: 8px; color: #9db8f0; border-color: var(--line); background: rgba(255,255,255,.04); }
.user .bubble { background: rgba(110,150,255,.24); color: var(--ink); border: 1px solid rgba(140,175,255,.45); border-radius: 14px 14px 4px 14px; }
.assistant .bubble { background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--accent); border-radius: 14px 14px 14px 4px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.bubble code { color: #a9c4ff; }
.bubble pre { border: 1px solid var(--line); border-radius: 10px; }
.imgs img { border-radius: 10px; border: 1px solid var(--line); }
.thumb img { border-radius: 8px; }
.icon-btn { color: #9db8f0; border-radius: 12px; background: rgba(255,255,255,.04); }
#composer { background: rgba(8,13,28,.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
#input { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); caret-color: var(--accent); }
#input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
#sendBtn { border-radius: 12px; background: linear-gradient(135deg, #6f9bff, #8a7dff); color: #06101f; box-shadow: 0 0 18px rgba(111,155,255,.35); }
#sendBtn.stop { background: var(--danger); color: #fff; box-shadow: none; }
.empty { margin: 14vh auto 0; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--muted); text-align: center; }
.empty .tip { margin-top: 10px; font-size: 12px; color: #7f8fae; }
#camBox { border: 1px solid var(--line); background: rgba(12,18,34,.94); }
</style>
</head>
<body>

<!-- ===================== 登录界面：启动画面 + 登录栏 ===================== -->
<div id="login">
  <div class="scan"></div>
  <div id="splash">
    <div class="hud"><b>RESTRICTED</b><span>ACCESS / CONTROL</span><i>REV 0.3 · LOCAL PROFILE</i><i>ID: RS-0001</i></div>
    <button id="skipBtn" type="button">跳过开场</button>
    <div class="xh xl"><u></u><small>NODE</small></div>
    <div class="xh xr"><u></u><small>KEY</small></div>
    <div class="xh xb"><u></u></div>
    <div class="center">
      <svg id="emblem" viewBox="0 0 120 110" aria-hidden="true">
        <defs><linearGradient id="sg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="120" y2="110">
          <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#7c838a"/></linearGradient></defs>
        <path class="f" d="M60 40 L84 82 L36 82 Z"/>
        <path class="p" pathLength="1" d="M60 6 L112 98 L8 98 Z"/>
        <path class="p" pathLength="1" d="M60 34 L88 84 L32 84 Z"/>
        <path class="p" pathLength="1" d="M60 52 L60 68"/>
        <path class="p" pathLength="1" d="M22 104 L98 104"/>
      </svg>
      <div id="word"></div>
      <div class="rule"></div>
      <div class="sub">禁 区 协 议</div>
      <div class="sub2">SINGLE-USER ACCESS CONTROL</div>
    </div>
    <div class="load"><span id="pct">000%</span><div class="bar"><i id="barfill"></i></div></div>
  </div>
  <svg id="rings" viewBox="0 0 400 400" aria-hidden="true">
    <circle class="r0" cx="200" cy="200" r="196" pathLength="100"/>
    <circle class="r1" cx="200" cy="200" r="186" pathLength="100"/>
    <circle class="r2" cx="200" cy="200" r="176" pathLength="100"/>
    <circle class="r3" cx="200" cy="200" r="160" pathLength="100"/>
    <circle class="r4" cx="200" cy="200" r="150" pathLength="100"/>
  </svg>
  <div class="lhud"><b>RESTRICTED</b><span>ACCESS / CONTROL</span><i>REV 0.3 · LOCAL PROFILE</i><i>ID: RS-0001</i></div>
  <form id="loginForm" class="idf off">
    <div class="eyebrow">IDENTITY VERIFICATION</div>
    <h1>访问身份确认</h1>
    <p class="hint">确认身份后，进入私有空间。</p>
    <div class="oline"></div>
    <div class="card">
      <div class="row"><span>访问身份</span><b>OWNER</b></div>
      <div class="row"><span>档案编号</span><b>RS-0001</b></div>
      <label class="row"><span>访问密钥</span><input id="pwd" type="password" autocomplete="current-password" aria-label="访问密码" required></label>
    </div>
    <div id="loginErr" role="alert"></div>
    <button class="primary" id="loginBtn" type="submit">确认身份</button>
  </form>
  <div class="foot">IDENTITY VERIFICATION · SECURE CHANNEL</div>
</div>

<!-- ===================== 聊天界面 ===================== -->
<div id="app" class="hidden">
  <div id="wall"></div>
  <header>
    <strong class="brand">RESTRICTED</strong>
    <div class="actions">
      <button id="newBtn" type="button">新对话</button>
      <button id="logoutBtn" type="button">退出</button>
    </div>
  </header>

  <div id="messages"><div class="inner" id="list"></div></div>

  <div id="composer">
    <div class="wrap">
      <div id="previews"></div>
      <div class="row">
        <!-- 选图按钮：从相册 / 文件选择（可多选） -->
        <button class="icon-btn" id="pickBtn" type="button" title="选择图片" aria-label="选择图片">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/></svg>
        </button>
        <!-- 拍照按钮：手机直接调后置摄像头；电脑弹出预览窗口 -->
        <button class="icon-btn" id="camBtn" type="button" title="拍照" aria-label="拍照">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="3.6"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="输入消息…" aria-label="消息"></textarea>
        <button id="sendBtn" type="button">发送</button>
      </div>
    </div>
  </div>
</div>

<!-- 隐藏的 file input：相册选图 -->
<input type="file" id="fileInput" accept="image/*" multiple class="hidden">
<!-- 隐藏的 file input：capture="environment" 会让手机直接打开后置摄像头 -->
<input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">

<!-- 电脑端摄像头预览窗口 -->
<div id="camModal" class="hidden" role="dialog" aria-modal="true" aria-label="拍照">
  <div id="camBox">
    <video id="camVideo" autoplay playsinline muted></video>
    <div class="btns">
      <button type="button" id="camCancel">取消</button>
      <button type="button" id="camShoot" class="shoot">拍照</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
 * 前端逻辑（原生 JavaScript）
 * 结构：
 *   A. 常量与状态        B. 登录 / 退出
 *   C. 图片处理（压缩）  D. 选图 / 拍照
 *   E. 渲染消息          F. 发送与流式接收
 * ===================================================================== */

/* ---------- A. 常量与状态 ---------- */
const TOKEN_KEY = 'ai_token';      // localStorage 里存 token 的键
const HISTORY_KEY = 'ai_history';  // localStorage 里存对话文字记录的键
const MAX_SIDE = 1600;             // 图片最长边压缩到 1600px（保证题目/文档清晰）
const JPEG_QUALITY = 0.7;          // JPEG 质量 0.7
const MAX_IMAGES_PER_MSG = 4;      // 单条消息最多 4 张图
const MAX_IMG_MSGS_SENT = 3;       // 发给后端时，只保留最近 3 条带图消息的原图（更早的图换成文字占位，避免请求越来越大）

const $ = (id) => document.getElementById(id);
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                  (navigator.maxTouchPoints > 1 && matchMedia('(pointer:coarse)').matches);

let conversationHistory = [];  // 完整对话，格式就是发给后端的 messages
let pendingImages = [];        // 已选择、等待发送的图片（base64 data URL）
let busy = false;              // 是否正在等 AI 回复
let abortCtrl = null;          // 用来中止流式请求

/* ---------- B. 登录 / 退出 ---------- */
function showChat() {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  loadHistory();
  try { localStorage.removeItem('ai_wallpaper'); } catch {}   // 清掉之前可能存过的壁纸
  renderAll();
}
function showLogin(msg) {
  localStorage.removeItem(TOKEN_KEY);
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('loginErr').textContent = msg || '';
  $('pwd').value = '';
  initLoginFx();   // 重新显示登录界面时，重播特效
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginBtn').disabled = true;
  $('loginErr').textContent = '';
  try {
    // 密码发给后端校验，前端不保存、也不知道正确密码
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('pwd').value }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || '登录失败');
    localStorage.setItem(TOKEN_KEY, data.token);  // token 存 localStorage，30 天内免登录
    $('loginErr').style.color = '#1b1b1b';
    $('loginErr').textContent = '身份已确认';
    await new Promise((r) => setTimeout(r, 650));   // 停一下，让"授权成功"被看到
    $('loginErr').style.color = '';
    $('loginErr').textContent = '';
    showChat();
  } catch (err) {
    $('loginErr').style.color = '';
    $('loginErr').textContent = '访问被拒绝：' + err.message;
  } finally {
    $('loginBtn').disabled = false;
  }
});

$('logoutBtn').addEventListener('click', () => showLogin(''));
$('newBtn').addEventListener('click', () => {
  if (busy) return;
  conversationHistory = [];
  saveHistory();
  renderAll();
});

/* ---------- C. 图片处理：压缩后转 base64 ---------- */
// 把 File（相册/手机拍照）读成压缩后的 JPEG data URL
async function fileToDataURL(file) {
  let bitmap;
  try {
    // imageOrientation: 'from-image' 会按 EXIF 自动摆正手机竖拍的照片
    bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch {
    // 个别浏览器不支持上面的写法，退回用 <img> 解码
    bitmap = await new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => reject(new Error('无法读取这张图片'));
      img.src = url;
    });
  }
  return drawToJPEG(bitmap, bitmap.width, bitmap.height);
}

// 把任意图像源（bitmap / img / video）缩放后画到 canvas，输出 JPEG base64
function drawToJPEG(source, w, h) {
  const scale = Math.min(1, MAX_SIDE / Math.max(w, h));  // 只缩小，不放大
  const cw = Math.round(w * scale), ch = Math.round(h * scale);
  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';            // 透明 PNG 转 JPEG 时避免变黑底
  ctx.fillRect(0, 0, cw, ch);
  ctx.drawImage(source, 0, 0, cw, ch);
  return canvas.toDataURL('image/jpeg', JPEG_QUALITY);
}

// 选图和拍照最终都走这里：压缩 -> 加入待发送列表 -> 显示预览
async function addImageFiles(files) {
  for (const f of files) {
    if (pendingImages.length >= MAX_IMAGES_PER_MSG) {
      alert(`一条消息最多 ${MAX_IMAGES_PER_MSG} 张图片`);
      break;
    }
    if (!f.type.startsWith('image/')) continue;
    try {
      pendingImages.push(await fileToDataURL(f));
    } catch (err) {
      alert(err.message);
    }
  }
  renderPreviews();
}

function renderPreviews() {
  const box = $('previews');
  box.innerHTML = '';
  pendingImages.forEach((url, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    const img = document.createElement('img');
    img.src = url; img.alt = '待发送图片';
    const x = document.createElement('button');
    x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', '移除图片');
    x.onclick = () => { pendingImages.splice(i, 1); renderPreviews(); };
    d.append(img, x);
    box.appendChild(d);
  });
}

/* ---------- D. 选图 / 拍照 ---------- */
$('pickBtn').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', async (e) => {
  await addImageFiles([...e.target.files]);
  e.target.value = '';   // 清空，这样再次选同一张图也能触发 change
});

// 手机拍照：这个 input 带 capture="environment"，系统会直接打开后置摄像头
$('cameraInput').addEventListener('change', async (e) => {
  await addImageFiles([...e.target.files]);
  e.target.value = '';
});

let camStream = null;

$('camBtn').addEventListener('click', () => {
  if (IS_MOBILE) $('cameraInput').click();  // 手机：调系统相机
  else openCamera();                         // 电脑：弹出预览窗口
});

async function openCamera() {
  // 摄像头只能在 HTTPS（或 localhost）下使用
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('当前环境无法使用摄像头（需要 HTTPS 或 localhost）。已改为从文件选择。');
    $('cameraInput').click();
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
    $('camVideo').srcObject = camStream;
    $('camModal').classList.remove('hidden');
  } catch (err) {
    alert('无法打开摄像头：' + (err.message || err.name) + '\n请检查浏览器的摄像头权限。');
  }
}

function closeCamera() {
  if (camStream) camStream.getTracks().forEach((t) => t.stop());  // 关掉摄像头，灯会熄灭
  camStream = null;
  $('camVideo').srcObject = null;
  $('camModal').classList.add('hidden');
}

$('camCancel').addEventListener('click', closeCamera);
$('camShoot').addEventListener('click', () => {
  const v = $('camVideo');
  if (!v.videoWidth) return;  // 画面还没出来
  // 从视频画面截一帧，走和选图完全相同的压缩流程
  pendingImages.push(drawToJPEG(v, v.videoWidth, v.videoHeight));
  renderPreviews();
  closeCamera();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('camModal').classList.contains('hidden')) closeCamera();
});

/* ---------- 电脑端：Ctrl+V（Mac 是 Cmd+V）直接粘贴截图，或把图片拖进页面 ---------- */
document.addEventListener('paste', async (e) => {
  if ($('app').classList.contains('hidden')) return;           // 还没登录时不处理
  const items = (e.clipboardData && e.clipboardData.items) || [];
  const files = [];
  for (const it of items) {
    if (it.kind === 'file' && it.type.startsWith('image/')) {
      const f = it.getAsFile();
      if (f) files.push(f);
    }
  }
  if (!files.length) return;                                    // 剪贴板里没有图片：按普通文字粘贴
  e.preventDefault();                                           // 有图片：拦下来，当作选图处理（同样会压缩、显示预览）
  await addImageFiles(files);
  $('input').focus();
});
document.addEventListener('dragover', (e) => { e.preventDefault(); });
document.addEventListener('drop', async (e) => {
  e.preventDefault();
  if ($('app').classList.contains('hidden')) return;
  await addImageFiles([...e.dataTransfer.files]);
});

/* ---------- 复制聊天内容时只复制纯文字（去掉颜色/背景），粘贴到 Google 文档、Word 里就不会是白字了 ---------- */
document.addEventListener('copy', (e) => {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.anchorNode) return;
  const el = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
  if (!el || !el.closest('#list')) return;                      // 只处理聊天消息区域，输入框里复制不受影响
  e.clipboardData.setData('text/plain', sel.toString());
  e.preventDefault();
});

/* ---------- E. 渲染消息 ---------- */
function escapeHTML(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 极简 Markdown：代码块、行内代码、粗体、标题。先转义 HTML，所以不会有注入风险。
function renderMarkdown(src) {
  return src.split('```').map((part, i) => {
    if (i % 2 === 1) {                       // 奇数段 = 代码块内部
      const nl = part.indexOf('\n');         // 第一行是语言名，丢掉
      const code = nl >= 0 ? part.slice(nl + 1) : part;
      return '<pre><code>' + escapeHTML(code.replace(/\n$/, '')) + '</code></pre>';
    }
    return escapeHTML(part)
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/^#{1,6}\s+(.+)$/gm, '<strong>$1</strong>');
  }).join('');
}

// 创建一条消息的 DOM；返回气泡元素，方便流式时更新
function addMessageEl(role, content) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  let text = '', images = [];
  if (typeof content === 'string') text = content;
  else if (Array.isArray(content)) {
    for (const p of content) {
      if (p.type === 'text') text += p.text;
      else if (p.type === 'image_url') images.push(p.image_url.url);
    }
  }

  if (images.length) {
    const g = document.createElement('div');
    g.className = 'imgs';
    images.forEach((u) => { const im = document.createElement('img'); im.src = u; im.alt = '图片'; g.appendChild(im); });
    wrap.appendChild(g);
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (text) {
    if (role === 'assistant') bubble.innerHTML = renderMarkdown(text);
    else bubble.textContent = text;
  } else if (images.length) {
    bubble.classList.add('hidden');  // 只有图片时不显示空气泡
  }
  wrap.appendChild(bubble);
  $('list').appendChild(wrap);
  return bubble;
}

function renderAll() {
  const list = $('list');
  list.innerHTML = '';
  if (!conversationHistory.length) {
    list.innerHTML = '<div class="empty"><div class="tip">发消息，或拍一张题目 / 文档的照片开始</div></div>';
  }
  conversationHistory.forEach((m) => addMessageEl(m.role, m.content));
  scrollToBottom(true);
}

function scrollToBottom(force) {
  const el = $('messages');
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 120;
  if (force || nearBottom) el.scrollTop = el.scrollHeight;
}

// 对话文字记录存到 localStorage（图片太大，存不下，只保留文字占位）
function saveHistory() {
  try {
    const slim = conversationHistory.map((m) => {
      if (typeof m.content === 'string') return m;
      const text = m.content.filter((p) => p.type === 'text').map((p) => p.text).join('');
      const n = m.content.filter((p) => p.type === 'image_url').length;
      return { role: m.role, content: (text + (n ? `\n[图片 ×${n}]` : '')).trim() };
    });
    localStorage.setItem(HISTORY_KEY, JSON.stringify(slim));
  } catch { /* 存储满了就忽略 */ }
}
function loadHistory() {
  try { conversationHistory = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
  catch { conversationHistory = []; }
}

/* ---------- F. 发送与流式接收 ---------- */
// 生成发给后端的 messages：完整保留文字；只有最近几条带图消息保留原图
function buildPayloadMessages() {
  let imgMsgsSeen = 0;
  const out = [];
  for (let i = conversationHistory.length - 1; i >= 0; i--) {
    const m = conversationHistory[i];
    if (Array.isArray(m.content) && m.content.some((p) => p.type === 'image_url')) {
      imgMsgsSeen++;
      if (imgMsgsSeen > MAX_IMG_MSGS_SENT) {
        const text = m.content.filter((p) => p.type === 'text').map((p) => p.text).join('');
        out.unshift({ role: m.role, content: text + '\n[此处原有图片，已省略]' });
        continue;
      }
    }
    out.unshift(m);
  }
  return out;
}

function setBusy(b) {
  busy = b;
  const btn = $('sendBtn');
  btn.textContent = b ? '停止' : '发送';
  btn.classList.toggle('stop', b);
}

async function send() {
  if (busy) return;
  const text = $('input').value.trim();
  if (!text && !pendingImages.length) return;

  // 1) 组装这条用户消息的 content
  let content;
  if (pendingImages.length) {
    // 有图片：content 用数组（文字 + 图片），detail 用 high 保留清晰度
    content = [{ type: 'text', text: text || '请识别图片中的内容，如果是题目请解答。' }];
    pendingImages.forEach((url) => {
      content.push({ type: 'image_url', image_url: { url, detail: 'high' } });
    });
  } else {
    content = text;  // 只有文字：普通字符串
  }

  const sentImages = pendingImages;
  conversationHistory.push({ role: 'user', content });
  if (conversationHistory.length === 1) $('list').innerHTML = '';  // 去掉空状态提示
  addMessageEl('user', content);

  $('input').value = ''; autoGrow();
  pendingImages = []; renderPreviews();

  // 2) 先放一个"正在思考"的 AI 气泡
  const bubble = addMessageEl('assistant', '');
  bubble.innerHTML = '<span class="thinking">正在思考<i>.</i><i>.</i><i>.</i></span>';
  scrollToBottom(true);

  setBusy(true);
  abortCtrl = new AbortController();
  let full = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem(TOKEN_KEY),  // 每次请求都带 token
      },
      body: JSON.stringify({ messages: buildPayloadMessages() }),
      signal: abortCtrl.signal,
    });

    if (res.status === 401) { showLogin('登录已过期，请重新登录'); return; }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || '请求失败 (' + res.status + ')');
    }

    // 3) 逐块读取 SSE 流：每行形如  data: {...}
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', raw = '';                    // raw：原始返回，仅在出错时用来显示
    outer: while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const piece = decoder.decode(value, { stream: true });
      if (raw.length < 400) raw += piece;
      buf += piece;
      const lines = buf.split('\n');
      buf = lines.pop();                       // 最后一行可能不完整，留到下一轮
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') break outer;
        try {
          const delta = JSON.parse(data).choices?.[0]?.delta;
          // delta.reasoning_content 是模型的思考过程：不显示，"正在思考"继续亮着
          if (delta && delta.content) {
            full += delta.content;
            bubble.innerHTML = renderMarkdown(full);
            scrollToBottom(false);
          }
        } catch { /* 忽略无法解析的行 */ }
      }
    }

    if (!full) throw new Error('AI 没有返回内容。服务器原始返回：' + (raw.slice(0, 300) || '（空）'));
    conversationHistory.push({ role: 'assistant', content: full });

  } catch (err) {
    if (err.name === 'AbortError') {
      // 用户点了"停止"：保留已生成的部分
      if (full) conversationHistory.push({ role: 'assistant', content: full });
      else { bubble.parentElement.remove(); conversationHistory.pop(); }
    } else {
      // 失败：显示错误，撤回这条用户消息，并把内容放回输入框，方便重试
      bubble.classList.add('error');
      bubble.textContent = err.message;
      conversationHistory.pop();
      $('input').value = text; autoGrow();
      pendingImages = sentImages; renderPreviews();
    }
  } finally {
    setBusy(false);
    abortCtrl = null;
    saveHistory();
  }
}

$('sendBtn').addEventListener('click', () => {
  if (busy && abortCtrl) abortCtrl.abort();  // 回复中点击 = 停止
  else send();
});

// 输入框：电脑上 Enter 发送，Shift+Enter 换行；手机上 Enter 换行（用发送按钮发送）
$('input').addEventListener('keydown', (e) => {
  // e.isComposing：正在用输入法打字（比如拼音选词时按回车）时不要发送
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !IS_MOBILE) {
    e.preventDefault();
    send();
  }
});
$('input').addEventListener('input', autoGrow);
function autoGrow() {
  const t = $('input');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 160) + 'px';
}

/* ---------- 登录界面开场：启动画面（按阶段加 class，CSS 负责动画） ---------- */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPL = { timers: [], raf: 0, done: false, started: false };

function reveal() {                                     // 登录栏淡入
  $('login').classList.add('on');                       // 圆环、角落文字淡入
  $('loginForm').classList.remove('off');
  setTimeout(() => $('pwd').focus(), 400);
}
function finishSplash() {                               // 结束（播完 / 点击跳过）
  if (SPL.done) return;
  SPL.done = true;
  SPL.timers.forEach(clearTimeout); cancelAnimationFrame(SPL.raf);
  $('pct').textContent = '100%'; $('barfill').style.width = '100%';
  $('splash').classList.add('s1', 's2', 's3', 's4', 's5', 'out');
  setTimeout(reveal, 300);
}
function runSplash() {
  const sp = $('splash');
  $('word').innerHTML = 'RESTRICTED'.split('').map((c, i) => '<span style="--i:' + i + '">' + c + '</span>').join('');
  const at = (ms, cls) => SPL.timers.push(setTimeout(() => sp.classList.add(cls), ms));
  at(300, 's1');    // HUD 文字、十字标记淡入
  at(800, 's2');    // 徽标线条描边
  at(2300, 's3');   // 徽标填充 + 发光
  at(2500, 's4');   // 标题逐字出现
  at(3300, 's5');   // 分隔线 + 副标题
  SPL.timers.push(setTimeout(finishSplash, 4900));      // 淡出，登录栏出现
  const t0 = performance.now();
  (function tick(now) {                                  // 进度条 0% -> 100%
    const p = Math.max(0, Math.min(1, (now - t0 - 600) / 4000));
    $('pct').textContent = String(Math.round(p * 100)).padStart(3, '0') + '%';
    $('barfill').style.width = (p * 100) + '%';
    if (p < 1 && !SPL.done) SPL.raf = requestAnimationFrame(tick);
  })(t0);
  sp.addEventListener('pointerdown', finishSplash, { once: true });   // 点屏幕任意处 / 跳过按钮 = 跳过
}
function initLoginFx() {
  if (SPL.started) { reveal(); return; }                // 已播放过（比如退出登录后再回来）：直接显示登录栏
  SPL.started = true;
  if (REDUCED) { SPL.done = true; $('splash').classList.add('out'); reveal(); return; }  // 系统开了"减少动态效果"
  runSplash();
}

/* ---------- 启动：有 token 就直接进聊天，否则显示登录 ---------- */
if (localStorage.getItem(TOKEN_KEY)) showChat(); else initLoginFx();
</script>
</body>
</html>
